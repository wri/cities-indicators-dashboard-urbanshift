name: Deploy to AWS Staging Environment

on:
  push:
    branches:
      - staging
  workflow_dispatch:

# One deploy at a time; the newest queued run goes after the current one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ssh-deploy:
    name: ssh-deploy
    runs-on: ubuntu-latest
    steps:
    - name: cd in repo dir
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.AWS_IP }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        command_timeout: 60m
        script: |
          set -e
          cd ~/cities-indicators-dashboard-urbanshift-staging
          git fetch --all
          git checkout staging
          git pull --ff-only

          # Keep the outgoing image as the rollback target.
          if docker image inspect staging-image >/dev/null 2>&1; then
            docker tag staging-image staging-image-previous
          fi

          docker build . -t staging-image
          docker rm -f staging-container || true
          docker run -d -p 4949:3838 --name staging-container --restart unless-stopped staging-image

          # Wait up to ~2 minutes for the app to answer.
          code=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:4949/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done

          if [ "$code" != "200" ]; then
            echo "Health check failed (last response: ${code:-none}). Container logs:"
            docker logs --tail 40 staging-container || true
            if docker image inspect staging-image-previous >/dev/null 2>&1; then
              echo "Rolling back to staging-image-previous"
              # Point staging-image back at the good build so the next deploy saves it as -previous.
              docker tag staging-image-previous staging-image
              docker rm -f staging-container
              docker run -d -p 4949:3838 --name staging-container --restart unless-stopped staging-image-previous
            fi
            exit 1
          fi

          echo "Healthy: staging is serving 200 on :4949"
          # Remove untagged leftovers only; never prune -a (it drops the base image).
          docker image prune -f
